<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Twig Robot Builder</title>
<style>
  :root{
    --lightblue:#bfe9ff; --lightblue-dark:#7fc4e8;
    --amber:#ffd27f; --green:#8fd89a;
    --panel:#0d2334; --panel-edge:#1d4258;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%;
    background:radial-gradient(ellipse at 50% 0%, #16324a 0%, #0a1a26 55%, #06101a 100%);
    font-family:"Segoe UI", system-ui, sans-serif; color:#eafaf0;
    overflow:hidden;
  }
  header{
    padding:14px 22px 8px;
  }
  header h1{
    margin:0; font-size:1.25rem; font-weight:600; letter-spacing:.08em;
    color:var(--lightblue); text-shadow:0 0 12px rgba(191,233,255,.6);
  }
  header p{
    margin:4px 0 0; font-size:.75rem; color:#9fd8ff; opacity:.8; letter-spacing:.04em;
  }
  header code{ color:var(--amber); font-size:.72rem; }
  #layout{
    display:flex; gap:14px; padding:12px 22px 18px;
    height:calc(100% - 64px);
  }

  /* ---------- left panel : clusters of log entries ---------- */
  #clusters{
    width:330px; min-width:330px; overflow-y:auto; padding-right:4px;
    display:flex; flex-direction:column; gap:12px;
  }
  .cluster{
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:10px;
    padding:10px 12px; cursor:pointer; transition:border-color .2s, box-shadow .2s;
  }
  .cluster:hover{ border-color:var(--lightblue-dark); }
  .cluster.selected{
    border-color:var(--lightblue);
    box-shadow:0 0 14px rgba(191,233,255,.25), inset 0 0 20px rgba(191,233,255,.05);
  }
  .cluster h2{
    margin:0; font-size:.85rem; font-weight:600; color:var(--lightblue); letter-spacing:.05em;
  }
  .cluster .pair{
    margin:2px 0 8px; font-size:.68rem; color:#9fd8ff; opacity:.75;
  }
  .cluster ol{
    margin:0; padding:0; list-style:none;
    font-family:Consolas, "Cascadia Mono", monospace; font-size:.68rem; line-height:1.5;
  }
  .cluster ol li{
    padding:1px 6px; border-left:2px solid transparent; border-radius:3px;
    color:#cfe8dc; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:background .3s, border-color .3s;
  }
  .cluster ol li .q{ color:var(--amber); }
  .cluster ol li .act{ color:var(--green); }
  .cluster ol li.hl{
    background:rgba(255,210,127,.16); border-left-color:var(--amber);
  }
  .cluster ol li.done{ border-left-color:rgba(255,210,127,.45); }

  /* ---------- stage ---------- */
  #stage{
    flex:1; display:flex; flex-direction:column; min-width:0;
    background:rgba(6,16,26,.45); border:1px solid var(--panel-edge); border-radius:10px;
    padding:8px 10px;
  }
  svg#scene{ flex:1; width:100%; height:100%; display:block; }
  #status{
    font-family:Consolas, "Cascadia Mono", monospace; font-size:.72rem;
    color:#9fd8ff; padding:4px 6px 2px; min-height:22px; letter-spacing:.03em;
  }
  #status .q{ color:var(--amber); }
  #controls{ display:flex; gap:10px; align-items:center; padding:2px 6px 4px; }
  button#btnReplay{
    padding:6px 18px; border:none; border-radius:999px;
    background:linear-gradient(180deg,var(--lightblue),var(--lightblue-dark));
    color:#0a2f45; font-size:.72rem; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase; cursor:pointer;
    box-shadow:0 3px 0 var(--lightblue-dark), 0 6px 12px rgba(0,0,0,.4);
  }
  button#btnReplay:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--lightblue-dark); }

  /* ---------- svg pieces ---------- */
  .ground{ stroke:#2c4a3a; stroke-width:2; }
  .jointRing{ fill:none; stroke:var(--lightblue); stroke-width:1.6; opacity:.85; }
  .pop{ transform-box:fill-box; transform-origin:center; }
  .labelWord{
    fill:var(--lightblue); font-size:13px; font-weight:600; letter-spacing:.04em;
    font-family:"Segoe UI", system-ui, sans-serif;
  }
  .labelQuarks{
    fill:var(--amber); font-size:11px;
    font-family:Consolas, "Cascadia Mono", monospace;
  }
  .labelGoal{ fill:var(--green); font-weight:600; }
  .arrow{ fill:none; stroke:var(--lightblue); stroke-width:1.2; opacity:.75; }
  .arrowGoal{ stroke:var(--green); }
</style>
</head>
<body>

<header>
  <h1>Twig Robot Builder</h1>
  <p>pick a cluster of log entries &rarr; the robot builds itself &rarr; every component is grounded by a quark cluster from <code>combinations.csv</code></p>
</header>

<div id="layout">
  <div id="clusters"></div>
  <div id="stage">
    <svg id="scene" viewBox="0 0 780 560" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="Twig robot assembling itself with quark labels">
      <defs>
        <marker id="arrowHead" viewBox="0 0 8 8" refX="7" refY="4"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L8,4 L0,8 z" fill="var(--lightblue)"/>
        </marker>
        <marker id="arrowHeadGoal" viewBox="0 0 8 8" refX="7" refY="4"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L8,4 L0,8 z" fill="var(--green)"/>
        </marker>
      </defs>
      <line class="ground" x1="30" y1="505" x2="750" y2="505"/>
      <g id="robot"></g>
      <g id="labels"></g>
    </svg>
    <div id="status">&nbsp;</div>
    <div id="controls"><button id="btnReplay">rebuild</button></div>
  </div>
</div>

<script>
(function(){
  const svgNS = "http://www.w3.org/2000/svg";
  const robotG  = document.getElementById("robot");
  const labelsG = document.getElementById("labels");
  const statusEl = document.getElementById("status");
  const clustersEl = document.getElementById("clusters");

  /* ---------- deterministic PRNG so each robot always grows the same twigs ---------- */
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* organic quadratic twig path between two points, jittered by seeded R */
  function twigD(R, x1, y1, x2, y2, jit){
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
    const nx=-dy/len, ny=dx/len;
    const b=(R()*2-1)*jit;
    return `M${x1},${y1} Q${mx+nx*b},${my+ny*b} ${x2},${y2}`;
  }

  /* ================================================================
     ROBOT DATA
     Each robot = one cluster of log entries (from log.csv) plus a
     parts list. Each part is a word from combinations.csv with its
     quark cluster, the log lines it grounds, drawing primitives and
     a label+arrow anchored to the finished geometry.
     ================================================================ */

  const ROBOTS = [
    {
      id:"anchor", seed:11, color:"#7a5230",
      name:"Anchor Climber",
      pair:"triangle: robot × tree — use load-bearing natural structures",
      log:[
        {t:"natural surface detected", q:"nature"},
        {t:"↳ mode", a:"scan_surface"},
        {t:"load-bearing point identified", q:"support"},
        {t:"↳ mode", a:"test_grip_point"},
        {t:"mechanical engagement possible", q:"machine"},
        {t:"↳ mode", a:"position_gripper"},
        {t:"structure usable as leverage", q:"tool"},
        {t:"↳ mode", a:"engage_anchor"},
        {t:"GOAL", q:"bond+support"},
      ],
      layout(R){
        const M=[360,412], TOP=[352,318], J1=[432,270], J2=[508,236];
        const gL=[556,200], gR=[560,258];
        return [
          part("leg",["support","force","animate"],[2],
            [ path(twigD(R,M[0],M[1],306,505,7),6,this.color),
              path(twigD(R,M[0],M[1],412,505,7),6,this.color),
              node(306,505,3.4,this.color), node(412,505,3.4,this.color),
              node(M[0],M[1],5,this.color) ],
            {x:190,y:470}, [318,468]),
          part("stem",["nature","support"],[0],
            [ path(twigD(R,M[0],M[1],TOP[0],TOP[1],6),7,this.color),
              node(TOP[0],TOP[1],4.5,this.color) ],
            {x:200,y:330}, [352,366]),
          part("arm",["support","force"],[3,5],
            [ path(twigD(R,TOP[0],TOP[1],J1[0],J1[1],6),6,this.color),
              path(twigD(R,J1[0],J1[1],J2[0],J2[1],5),5,this.color),
              node(J1[0],J1[1],4,this.color), node(J2[0],J2[1],3.6,this.color) ],
            {x:330,y:170}, [392,290]),
          part("servo",["drive","force","transducer"],[4],
            [ ring(TOP[0],TOP[1],7), ring(J1[0],J1[1],6), ring(J2[0],J2[1],5.5) ],
            {x:520,y:120}, [434,266]),
          part("grasper",["tool","animate","force"],[6,7],
            [ path(twigD(R,J2[0],J2[1],gL[0],gL[1],4),3.4,this.color),
              path(twigD(R,J2[0],J2[1],gR[0],gR[1],4),3.4,this.color),
              node(gL[0],gL[1],2.6,this.color), node(gR[0],gR[1],2.6,this.color) ],
            {x:665,y:130}, [552,228]),
          part("goal bond+support",null,[8],
            [ path(twigD(R,748,226,586,230,8),6,"#4f6b3a"),
              leaf(620,222,9,-30), leaf(660,236,9,20),
              node(586,230,3.4,"#4f6b3a") ],
            {x:665,y:330}, [606,236], true),
        ];
      }
    },
    {
      id:"energy", seed:23, color:"#6b4423",
      name:"Energy Keeper",
      pair:"triangle: robot × battery — keep robot powered",
      log:[
        {t:"battery_% < 30", q:"stat low"},
        {t:"↳ mode", a:"recharge_mode"},
        {t:"battery_% < 10", q:"stat empty"},
        {t:"↳ mode", a:"safe_wait"},
        {t:"battery hot condition", q:"stat hot"},
        {t:"↳ mode", a:"cool_down"},
        {t:"GOAL", q:"energy+stat full"},
      ],
      layout(R){
        const M=[380,420];
        return [
          part("leg",["support","force","animate"],[3],
            [ path(twigD(R,M[0],M[1],322,505,7),6,this.color),
              path(twigD(R,M[0],M[1],436,505,7),6,this.color),
              node(322,505,3.4,this.color), node(436,505,3.4,this.color),
              node(M[0],M[1],5,this.color) ],
            {x:200,y:480}, [336,468]),
          part("body",["container","support","animate"],[],
            [ path(twigD(R,M[0],M[1],376,296,6),8,this.color),
              ring(M[0],M[1],7), node(376,296,4.5,this.color) ],
            {x:210,y:380}, [376,368]),
          part("battery",["energy","transducer"],[0,2,6],
            [ rect(346,336,62,40,7,"#3a2c14","#ffd27f"),
              path("M356,356 h14 M363,349 v14 M392,356 h12",0,null,"#ffd27f",2), ],
            {x:580,y:400}, [410,358]),
          part("leaf",["nature","vitality","plant"],[1],
            [ path(twigD(R,376,296,322,238,6),4,this.color),
              leaf(310,228,11,-35), leaf(336,214,10,-5), leaf(292,248,8,-70),
              node(322,238,3,this.color) ],
            {x:170,y:190}, [318,236]),
          part("sensor",["data","transducer"],[0,2,4],
            [ path(twigD(R,376,296,414,242,5),4,this.color),
              ring(418,234,9), node(418,234,3.4,"#bfe9ff") ],
            {x:580,y:200}, [420,238]),
          part("goal energy+stat full",null,[6],
            [ path("M470,150 l0,-34 M460,128 l10,-12 10,12",0,null,"#8fd89a",2.4) ],
            {x:640,y:110}, [472,128], true),
        ];
      }
    },
    {
      id:"scout", seed:37, color:"#5b3a22",
      name:"Branch Scout",
      pair:"grounding rules — sensors on the path ahead",
      log:[
        {t:"path_density > 0.5", q:"pattern"},
        {t:"path_density < 0.1", q:"stat empty"},
        {t:"branch_osc_hz > 2.0", q:"stat fast"},
        {t:"branch_integrity < 0.3", q:"stat broken"},
        {t:"grip_success < 0.5", q:"problem"},
      ],
      layout(R){
        return [
          part("wheel",["transport","tool"],[],
            [ ring(318,481,22), ring(432,481,22),
              node(318,481,4,this.color), node(432,481,4,this.color) ],
            {x:190,y:440}, [298,472]),
          part("body",["container","support"],[],
            [ path(twigD(R,318,481,318,458,3),5,this.color),
              path(twigD(R,432,481,432,458,3),5,this.color),
              path(twigD(R,306,458,446,458,5),7,this.color),
              node(318,458,3.5,this.color), node(432,458,3.5,this.color) ],
            {x:200,y:540}, [370,460]),
          part("arm",["support","force"],[4],
            [ path(twigD(R,440,458,522,416,7),5,this.color),
              path(twigD(R,522,416,592,430,6),4,this.color),
              node(522,416,3.6,this.color), ring(522,416,5.5),
              node(592,430,3,this.color) ],
            {x:640,y:360}, [558,420]),
          part("thorn",["plant","nature","stat rough"],[4],
            [ path("M592,430 l16,-10 M592,430 l19,2 M592,430 l12,12",0,null,this.color,2.2) ],
            {x:680,y:480}, [602,432]),
          part("stem",["nature","support"],[],
            [ path(twigD(R,374,458,368,330,7),6,this.color),
              node(368,330,4,this.color), ring(368,330,6) ],
            {x:210,y:360}, [370,395]),
          part("camera",["tool","transducer"],[3],
            [ path(twigD(R,370,382,326,356,4),3.6,this.color),
              ring(320,352,8), node(320,352,3,"#bfe9ff") ],
            {x:170,y:280}, [318,354]),
          part("radar",["pattern","tool","transducer"],[0,1,2],
            [ path(twigD(R,368,330,398,298,4),3.6,this.color),
              path("M382,300 A22,22 0 0 1 420,282",0,null,"#bfe9ff",2),
              node(398,296,2.6,"#bfe9ff") ],
            {x:560,y:170}, [404,290]),
        ];
      }
    },
  ];

  /* ---------- primitive constructors ---------- */
  function part(word, quarks, logRefs, prims, label, anchor, isGoal){
    return {word, quarks, logRefs, prims, label, anchor, isGoal:!!isGoal};
  }
  function path(d,w,color,stroke,sw){ return {t:"path", d, w:sw||w, color:stroke||color}; }
  function node(x,y,r,color){ return {t:"node", x,y,r,color}; }
  function ring(x,y,r){ return {t:"ring", x,y,r}; }
  function leaf(x,y,r,rot){ return {t:"leaf", x,y,r,rot}; }
  function rect(x,y,w,h,rx,fill,stroke){ return {t:"rect", x,y,w,h,rx,fill,stroke}; }

  /* ---------- svg element helpers ---------- */
  function el(name, attrs, parent){
    const e = document.createElementNS(svgNS, name);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }

  function drawPrim(prim, color, dur){
    if(prim.t === "path"){
      const p = el("path", {d:prim.d, stroke:prim.color||color, "stroke-width":prim.w,
                            "stroke-linecap":"round", fill:"none"}, robotG);
      const len = p.getTotalLength();
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
      p.getBoundingClientRect();
      p.style.transition = `stroke-dashoffset ${dur}ms ease`;
      p.style.strokeDashoffset = 0;
      return p;
    }
    let e;
    if(prim.t === "node") e = el("circle",{cx:prim.x,cy:prim.y,r:prim.r,fill:prim.color||color},robotG);
    if(prim.t === "ring") e = el("circle",{cx:prim.x,cy:prim.y,r:prim.r,class:"jointRing"},robotG);
    if(prim.t === "leaf") e = el("ellipse",{cx:prim.x,cy:prim.y,rx:prim.r,ry:prim.r*0.45,
                                 fill:"#5f9e58", transform:`rotate(${prim.rot} ${prim.x} ${prim.y})`},robotG);
    if(prim.t === "rect") e = el("rect",{x:prim.x,y:prim.y,width:prim.w,height:prim.h,rx:prim.rx,
                                 fill:prim.fill,stroke:prim.stroke,"stroke-width":1.6},robotG);
    e.classList.add("pop");
    e.style.opacity = 0; e.style.transform = "scale(.2)";
    e.getBoundingClientRect();
    e.style.transition = `opacity ${dur*0.6}ms ease, transform ${dur*0.6}ms cubic-bezier(.2,1.6,.4,1)`;
    e.style.opacity = 1; e.style.transform = "scale(1)";
    return e;
  }

  function drawLabel(partDef){
    const {label, anchor, word, quarks, isGoal} = partDef;
    const g = el("g", {}, labelsG);
    g.style.opacity = 0;

    const wordText = el("text", {x:label.x, y:label.y, "text-anchor":"middle",
      class: isGoal ? "labelWord labelGoal" : "labelWord"}, g);
    wordText.textContent = word;
    if(quarks){
      const qText = el("text", {x:label.x, y:label.y+16, "text-anchor":"middle", class:"labelQuarks"}, g);
      qText.textContent = quarks.join(" + ");
    }

    const goingDown = anchor[1] > label.y;
    const fy = goingDown ? label.y + (quarks ? 26 : 10) : label.y - 16;
    const fx = label.x, ax = anchor[0], ay = anchor[1];
    const mx = (fx+ax)/2, my = (fy+ay)/2;
    const dx = ax-fx, dy = ay-fy, len = Math.hypot(dx,dy)||1;
    const bend = 18 * (fx < ax ? 1 : -1);
    el("path", {d:`M${fx},${fy} Q${mx - dy/len*bend},${my + dx/len*bend} ${ax},${ay}`,
                class: isGoal ? "arrow arrowGoal" : "arrow",
                "marker-end": isGoal ? "url(#arrowHeadGoal)" : "url(#arrowHead)"}, g);

    g.getBoundingClientRect();
    g.style.transition = "opacity 500ms ease";
    g.style.opacity = 1;
  }

  /* ---------- left panel ---------- */
  let selected = null, buildToken = 0;

  ROBOTS.forEach(robot => {
    const card = document.createElement("div");
    card.className = "cluster";
    card.innerHTML = `<h2>${robot.name}</h2><div class="pair">${robot.pair}</div>`;
    const ol = document.createElement("ol");
    robot.log.forEach(line => {
      const li = document.createElement("li");
      li.innerHTML = line.a
        ? `${line.t} <span class="act">${line.a}</span>`
        : `${line.t} → <span class="q">${line.q}</span>`;
      ol.appendChild(li);
    });
    card.appendChild(ol);
    card.addEventListener("click", () => select(robot));
    clustersEl.appendChild(card);
    robot._card = card;
  });

  function select(robot){
    selected = robot;
    ROBOTS.forEach(r => r._card.classList.toggle("selected", r === selected));
    build(robot);
  }

  /* ---------- the build sequence ---------- */
  const sleep = ms => new Promise(res => setTimeout(res, ms));

  async function build(robot){
    const token = ++buildToken;
    robotG.innerHTML = ""; labelsG.innerHTML = "";
    ROBOTS.forEach(r => r._card.querySelectorAll("li").forEach(li => li.classList.remove("hl","done")));
    statusEl.innerHTML = "&nbsp;";
    await sleep(250);

    const parts = robot.layout(mulberry32(robot.seed));
    const lis = robot._card.querySelectorAll("li");

    for(const p of parts){
      if(token !== buildToken) return;

      statusEl.innerHTML = p.quarks
        ? `building <b>${p.word}</b> &mdash; grounded by <span class="q">${p.quarks.join(" + ")}</span>`
        : `reaching <b>${p.word}</b>`;

      p.prims.forEach(prim => drawPrim(prim, robot.color, 600));
      p.logRefs.forEach(i => lis[i] && lis[i].classList.add("hl"));

      await sleep(520);
      if(token !== buildToken) return;
      drawLabel(p);

      await sleep(620);
      if(token !== buildToken) return;
      p.logRefs.forEach(i => {
        if(lis[i]){ lis[i].classList.remove("hl"); lis[i].classList.add("done"); }
      });
    }
    if(token === buildToken)
      statusEl.innerHTML = `<b>${robot.name}</b> assembled &mdash; every component grounded in quarks`;
  }

  document.getElementById("btnReplay").addEventListener("click", () => selected && build(selected));
  select(ROBOTS[0]);
})();
</script>

</body>
</html>
