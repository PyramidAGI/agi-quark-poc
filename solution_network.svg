<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-label="Diagram of three columns of four dots each, labelled Onto-Drawing, Triangle Tree, and log.csv, connected by lines representing one particular solution">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e4e9ee" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="760" height="500" fill="#f4f6f8"/>
  <rect x="0" y="0" width="760" height="500" fill="url(#grid)"/>

  <!-- column centerlines (dash-dot, engineering convention) -->
  <g stroke="#94a5b5" stroke-width="1" stroke-dasharray="16 5 3 5">
    <line x1="150" y1="60" x2="150" y2="470"/>
    <line x1="380" y1="60" x2="380" y2="470"/>
    <line x1="610" y1="60" x2="610" y2="470"/>
  </g>

  <!-- column headers -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="1.5" text-anchor="middle">
    <text x="150" y="48" fill="#22303d">ONTO-DRAWING</text>
    <text x="380" y="48" fill="#22303d">TRIANGLE TREE</text>
    <text x="610" y="48" fill="#22303d">LOG.CSV</text>
  </g>

  <!-- connections: solid = adjacent-column links, dashed = long-range cross-column link -->
  <g fill="none" stroke="#4a5d70" stroke-width="1.6" stroke-linecap="round">
    <line x1="150" y1="140" x2="380" y2="230"/> <!-- O1-T2 -->
    <line x1="150" y1="230" x2="380" y2="140"/> <!-- O2-T1 -->
    <line x1="150" y1="230" x2="380" y2="410"/> <!-- O2-T4 -->
    <line x1="150" y1="320" x2="380" y2="320"/> <!-- O3-T3 -->
    <line x1="150" y1="410" x2="380" y2="410"/> <!-- O4-T4 -->
    <line x1="380" y1="140" x2="610" y2="140"/> <!-- T1-L1 -->
    <line x1="380" y1="230" x2="610" y2="320"/> <!-- T2-L3 -->
    <line x1="380" y1="320" x2="610" y2="230"/> <!-- T3-L2 -->
    <line x1="380" y1="410" x2="610" y2="410"/> <!-- T4-L4 -->
    <line x1="380" y1="320" x2="610" y2="410"/> <!-- T3-L4 -->
  </g>
  <path d="M 150 140 Q 380 30 610 230" fill="none" stroke="#4a5d70" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round"/> <!-- O1-L2 long-range -->

  <!-- nodes: Onto-Drawing column -->
  <g>
    <circle cx="150" cy="140" r="9" fill="#2a78d6" stroke="#22303d" stroke-width="1.6"/>
    <circle cx="150" cy="230" r="9" fill="#2a78d6" stroke="#22303d" stroke-width="1.6"/>
    <circle cx="150" cy="320" r="9" fill="#2a78d6" stroke="#22303d" stroke-width="1.6"/>
    <circle cx="150" cy="410" r="9" fill="#2a78d6" stroke="#22303d" stroke-width="1.6"/>
  </g>
  <!-- nodes: Triangle Tree column -->
  <g>
    <circle cx="380" cy="140" r="9" fill="#008300" stroke="#22303d" stroke-width="1.6"/>
    <circle cx="380" cy="230" r="9" fill="#008300" stroke="#22303d" stroke-width="1.6"/>
    <circle cx="380" cy="320" r="9" fill="#008300" stroke="#22303d" stroke-width="1.6"/>
    <circle cx="380" cy="410" r="9" fill="#008300" stroke="#22303d" stroke-width="1.6"/>
  </g>
  <!-- nodes: log.csv column -->
  <g>
    <circle cx="610" cy="140" r="9" fill="#e87ba4" stroke="#22303d" stroke-width="1.6"/>
    <circle cx="610" cy="230" r="9" fill="#e87ba4" stroke="#22303d" stroke-width="1.6"/>
    <circle cx="610" cy="320" r="9" fill="#e87ba4" stroke="#22303d" stroke-width="1.6"/>
    <circle cx="610" cy="410" r="9" fill="#e87ba4" stroke="#22303d" stroke-width="1.6"/>
  </g>

  <!-- node codes -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#94a5b5">
    <text x="128" y="124">O1</text><text x="128" y="214">O2</text><text x="128" y="304">O3</text><text x="128" y="394">O4</text>
    <text x="392" y="124">T1</text><text x="392" y="214">T2</text><text x="392" y="304">T3</text><text x="392" y="394">T4</text>
    <text x="626" y="124">L1</text><text x="626" y="214">L2</text><text x="626" y="304">L3</text><text x="626" y="394">L4</text>
  </g>
</svg>
